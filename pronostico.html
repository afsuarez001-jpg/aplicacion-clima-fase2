    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            Clima Hoy
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="pronostico.html">
                        Pronóstico
                    </a>

                <li class="nav-item">
                    <a class="nav-link" href="detalles.html">
                        Detalles
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<main class="container py-5">

    <div class="text-center mb-5">

        <h1>Pronóstico del clima</h1>

        <p class="text-muted">
            Ciudad de México
        </p>

    </div>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-lg-3">

            <div class="card forecast-card shadow text-center">

                <div class="card-body">

                    <h5>Hoy</h5>

                    <div class="fs-1">☀️</div>

                    <h3>24 °C</h3>

                    <p>Soleado</p>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-lg-3">

            <div class="card forecast-card shadow text-center">

                <div class="card-body">

                    <h5>Mañana</h5>

                    <div class="fs-1">🌤️</div>

                    <h3>23 °C</h3>

                    <p>Parcialmente nublado</p>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-lg-3">

            <div class="card forecast-card shadow text-center">

                <div class="card-body">

                    <h5>Viernes</h5>

                    <div class="fs-1">🌧️</div>

                    <h3>21 °C</h3>

                    <p>Lluvia ligera</p>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-lg-3">

            <div class="card forecast-card shadow text-center">

                <div class="card-body">

                    <h5>Sábado</h5>

                    <div class="fs-1">⛅</div>

                    <h3>22 °C</h3>

                    <p>Nublado</p>

                </div>

            </div>

        </div>

    </div>

</main>

<footer class="bg-primary text-white text-center py-3">

    <p class="mb-0">
        Clima Hoy © 2026
    </p>
