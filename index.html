<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Hoy</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Clima Hoy</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="pronostico.html">Pronóstico</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="detalles.html">Detalles</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">

    <section class="text-center mb-4">
        <h1 class="fw-bold">Consulta el clima</h1>
        <p class="text-muted">
            Conoce las condiciones climáticas de tu ciudad.
        </p>
    </section>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="input-group mb-4">
                <input type="text" id="ciudad" class="form-control"
                    placeholder="Escribe una ciudad">

                <button class="btn btn-primary" onclick="buscarCiudad()">
                    Buscar
                </button>
            </div>

        </div>
    </div>

    <section class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow text-center clima-card">

                <div class="card-body">

                    <h2 id="nombreCiudad">Ciudad de México</h2>

                    <div class="clima-icono">
                        ☀️
                    </div>

                    <h3 id="temperatura">24 °C</h3>

                    <p id="descripcion">
                        Soleado
                    </p>

                    <div class="row">

                        <div class="col-6">
                            <p>
                                <strong>Humedad</strong><br>
                                45%
                            </p>
                        </div>

                        <div class="col-6">
                            <p>
                                <strong>Viento</strong><br>
                                12 km/h
                            </p>
                        </div>

                    </div>

                    <a href="detalles.html" class="btn btn-outline-primary">
                        Ver detalles
                    </a>

                </div>

            </div>

        </div>

    </section>

</main>

<footer class="bg-primary text-white text-center py-3">
    <p class="mb-0">Clima Hoy © 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
